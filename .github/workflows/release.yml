name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: dotmatrix-linux-amd64
          - os: macos-15
            artifact: dotmatrix-darwin-arm64
          - os: macos-15-intel
            artifact: dotmatrix-darwin-amd64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm yasm pkg-config \
            libx264-dev libx265-dev libnuma-dev libvpx-dev \
            libmp3lame-dev libopus-dev libvorbis-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install nasm pkg-config x264 x265 libvpx lame opus libvorbis

      - name: Build FFmpeg 8.0.1 with static libraries
        run: |
          # Set up paths for homebrew on macOS
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig:$(brew --prefix lame)/lib/pkgconfig:$(brew --prefix opus)/lib/pkgconfig:$(brew --prefix libvorbis)/lib/pkgconfig:$(brew --prefix x264)/lib/pkgconfig:$(brew --prefix x265)/lib/pkgconfig:$(brew --prefix libvpx)/lib/pkgconfig"
            export LDFLAGS="-L$(brew --prefix)/lib"
            export CFLAGS="-I$(brew --prefix)/include"
          fi
          curl -L https://ffmpeg.org/releases/ffmpeg-8.0.1.tar.xz | tar -xJ
          cd ffmpeg-8.0.1
          ./configure \
            --enable-gpl \
            --enable-libx264 \
            --enable-libx265 \
            --enable-libvpx \
            --enable-libmp3lame \
            --enable-libopus \
            --enable-libvorbis \
            --enable-static \
            --disable-shared \
            --prefix=$HOME/ffmpeg
          make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          make install

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build with static FFmpeg
        env:
          CGO_ENABLED: 1
        run: |
          export PKG_CONFIG_PATH="$HOME/ffmpeg/lib/pkgconfig"
          export CGO_LDFLAGS="$(pkg-config --static --libs libavdevice libavformat libavcodec libswscale libswresample libavutil)"
          export CGO_CFLAGS="$(pkg-config --cflags libavdevice libavformat libavcodec libswscale libswresample libavutil)"
          go build -ldflags "-X main.version=${{ steps.version.outputs.VERSION }}" -o dotmatrix ./cmd/dotmatrix

      - name: Ad-hoc code sign (macOS)
        if: runner.os == 'macOS'
        run: codesign --sign - --force dotmatrix

      - name: Create archive
        run: |
          tar -czvf ${{ matrix.artifact }}.tar.gz dotmatrix

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.tar.gz
